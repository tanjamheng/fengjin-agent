# Agent 配置
agent:
  name: "风堇"
  max_tokens: 1024
  temperature: 0.7
  thinking_enabled: false  # 已废弃，保留兼容
  max_tool_rounds: 5  # tool calling 最大循环轮数

# 系统提示词：指向独立文件，方便单独编辑管理
system_prompt_file: "system_prompt.md"

# WebSocket 服务器配置
server:
  websocket_host: "127.0.0.1"
  websocket_port: 8765
  # 主端口不可用（例如被 Windows 排除）时按顺序尝试；仅影响当次进程。
  # 均低于 Windows 默认动态端口区（49152+）；当前未被本机监听或排除。
  websocket_fallback_ports: [8888, 18888, 28888, 38888, 40888, 45888, 48888]
