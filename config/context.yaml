# 多轮对话上下文管理配置
context:
  # 运行时日期时间只注入本轮 API user message，不写入会话历史。
  # 用于正确理解“今天/昨天/明天”等相对时间表达。
  temporal:
    enabled: true
    timezone_label: "Asia/Shanghai"
    utc_offset_minutes: 480
    include_clock: true

  # 滑动窗口
  sliding_window:
    # 最大保留轮数（一轮 = 一对 user/assistant 交互）
    # 每轮实际占用 2~4 条 message（无 tool calling = 2，有 = 4）
    max_turns: 25

    # messages 部分的 token 预算（兜底保护）
    # 正常对话下轮数保护先触发；用户发超长内容时 token 保护兜底
    max_tokens: 50000

  # 记忆合并
  memory:
    # 是否启用记忆检索（开关，方便调试）
    enabled: true

    # 注入模板（{memory} 和 {input} 是占位符）
    # 记忆检索结果合并到当前 user message 的格式
    template: "{memory}\n\n{input}"
