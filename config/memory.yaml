# 记忆系统配置
memory:
  # ChromaDB 存储配置
  # embedding_model: 支持 HuggingFace model_id 或本地目录路径
  chroma:
    persist_directory: "data/chroma"
    collection_name: "memories"
    embedding_model: "models/bge-m3"
    device: "auto"  # 与 RAG 共享同一 bge-m3 实例（embedding_registry），统一 GPU 策略

  # 内容提取配置（每轮对话后异步调用的小模型）
  extraction:
    max_tokens: 2048
    prompt_file: "config/prompts/memory_extraction.md"

  # 冲突消解配置（仅在检测到记忆冲突时调用）
  merge:
    max_tokens: 512
    prompt_file: "config/prompts/memory_merge.md"

  # 阈值体系（基于 cosine distance，0=相同，越大越不相关）
  thresholds:
    dedup_distance: 0.1        # < 0.1 视为重复，丢弃
    conflict_distance: 0.15    # < 0.15 视为可能冲突，调 LLM 合并（必须 > dedup_distance）
    conflict_candidates: 3     # 全库取候选池，再优先选择原始 importance 同层的冲突对象

  # 检索配置
  retrieval:
    top_k: 3
    # 临时状态不硬删除：扩大候选池后按年龄增加距离惩罚，
    # 使旧临时状态逐渐降权，但明确询问往事时仍有机会被召回。
    candidate_multiplier: 3
    temporary_decay_per_day: 0.02
    temporary_max_penalty: 0.5

  # Core 常驻记忆容量。Token 使用与上下文模块一致的轻量估算，
  # 超限时只把最久未进入或更新的非保护 Core 降级为普通向量记忆，不删除、不重算 Embedding。
  core_capacity:
    enabled: true
    max_items: 50
    max_tokens: 1500
    protected_patterns:
      - "过敏|忌口|禁忌|不能吃|不可食用"
      - "叫我|称呼我|称呼为|别叫我|不要叫我"
      - "明确边界|底线|禁止|绝对不要|不希望(?:你|风堇)"

  # 核心记忆视图文件路径
  core_file: "data/memory/core_memory.md"

  # 规则过滤
  filter:
    blacklist_patterns:
      - "\\d{11}"
      - "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
      - "\\b\\d{16,19}\\b"
      - "(QQ|qq)[:： ]?\\d{5,12}"
      - "(微信|WeChat|wechat|wx|WX)[:： ]?[A-Za-z0-9_-]{5,}"
      - "密码|password"
      - "身份证|身份证号"
      - "银行卡|银行卡号|信用卡|手机号|电话号码|邮箱|电子邮箱"
      - "住址|家庭住址|详细地址|门牌号|楼栋|单元号"
      - "真实姓名|全名|本名"
