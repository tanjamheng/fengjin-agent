# 记忆系统配置
memory:
  # ChromaDB 存储配置
  # embedding_model: 支持 HuggingFace model_id 或本地目录路径
  chroma:
    persist_directory: "data/chroma"
    collection_name: "memories"
    embedding_model: "models/bge-m3"
    device: "cpu"

  # 内容提取配置（每轮对话后异步调用的小模型）
  extraction:
    max_tokens: 2048
    prompt_file: "config/prompts/memory_extraction.md"

  # 冲突消解配置（仅在检测到记忆冲突时调用）
  merge:
    max_tokens: 512
    prompt_file: "config/prompts/memory_merge.md"

  # 阈值体系（基于 cosine distance，0=相同，越大越不相关）
  thresholds:
    dedup_distance: 0.1        # < 0.1 视为重复，丢弃
    conflict_distance: 0.15    # < 0.15 视为可能冲突，调 LLM 合并（必须 > dedup_distance）

  # 检索配置
  retrieval:
    top_k: 3

  # 核心记忆视图文件路径
  core_file: "data/memory/core_memory.md"

  # 规则过滤
  filter:
    blacklist_patterns:
      - "\\d{11}"
      - "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
      - "\\b\\d{16,19}\\b"
      - "(QQ|qq)[:： ]?\\d{5,12}"
      - "(微信|WeChat|wechat|wx|WX)[:： ]?[A-Za-z0-9_-]{5,}"
      - "密码|password"
      - "身份证|身份证号"
      - "银行卡|银行卡号|信用卡|手机号|电话号码|邮箱|电子邮箱"
      - "住址|家庭住址|详细地址|门牌号|楼栋|单元号"
      - "真实姓名|全名|本名"
