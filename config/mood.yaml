# 风堇情绪状态机配置
# =====================
# 所有参数都有默认值，不配置也能运行。
# 调参指南：改一个值 → 重启 → 聊几轮感受变化 → 再决定要不要继续调。
# 调参原则：一次只改一个参数，否则不知道哪个在起作用。

mood:
  # ── PAD 初始值（首次对话时使用）──────────────────────────────
  # 这三个值就是"风堇的性格指纹"——不是任意数字，
  # 而是从她的角色定位推导出来的。
  defaults:
    pleasure: 0.65         # 微微偏暖——她心里有光，不是中性的"0"
                            # 范围: [-1, +1]。越高越开心。
                            # 0.6~0.7 = 日常温暖，0.3~0.5 = 偏平淡，
                            # 0.0~0.2 = 偏冷淡，负数 = 低落
    arousal: 0.25           # 安静——像院子里吹着轻轻的风
                            # 范围: [0, 1]。越高越兴奋。
                            # 0.2~0.4 = 安静平和，0.5~0.7 = 活跃健谈，
                            # 0.8+ = 兴奋/激动
    dominance: 0.52         # 中等偏稳——不需要主导一切，但有自己节奏
                            # 范围: [-1, +1]。越高越有掌控感。
                            # 0.4~0.6 = 温和自信，0.7+ = 引导对话，
                            # <0.3 = 被动/倾听模式

  # ── EMA 平滑（情绪更新的惯性）────────────────────────────────
  ema:
    alpha: 0.3              # 新值权重。范围: (0, 1]，推荐 0.2~0.5
                            # 0.1 = 情绪像石头，聊 10 轮几乎不变
                            # 0.3 = 有惯性但不僵硬，推荐值
                            # 0.5 = 两轮就能翻转情绪，像情绪不稳的人
                            # 0.7+ = 接近直接赋值，白做了 EMA
                            #
                            # α=0.3 时，一次事件的影响大致持续 3~5 轮

  # ── 时间衰减（情绪随时间向温暖底色回归）──────────────────────
  # 公式: E(t) = baseline + (E₀ − baseline) × e^(−λ × hours)
  # 衰减在每次 load/update 时自动计算，不需后台线程。
  decay:
    # 正向情绪半衰期——高于基线时，多久衰减一半距离
    half_life_positive_h: 96  # 96 小时 = 4 天
                              # 意思是：特别开心的事，4 天后感受淡了一半
                              # 调大 → 好事记更久（如 168h = 一周）
                              # 调小 → 好事忘得也快（如 48h = 两天）

    # 负向情绪半衰期——低于基线时，多久衰减一半距离
    half_life_negative_h: 48  # 48 小时 = 2 天
                              # 意思是：不开心的事，2 天后就淡了一半
                              # 比正向短 → 坏心情比好心情消散得快
                              # 这就是风堇"不容易陷入负面情绪"的实现方式
                              # 调大 → 负面情绪持续更久（如 72h）
                              # 调小 → 更快恢复（如 24h ="睡一觉就没事了"）

    # 温暖底色——情绪回归的目标值（不是数学上的 0）
    baseline_pleasure: 0.65   # 与 defaults.pleasure 保持一致
    baseline_arousal: 0.25    # 与 defaults.arousal 保持一致
    baseline_dominance: 0.52  # 与 defaults.dominance 保持一致

    # 最小衰减间隔——短于此值不衰减（避免对话中多此一举）
    min_interval_seconds: 36  # 36 秒内有对话 → 跳过衰减

  # ── 阈值触发（极端状态的安全网）──────────────────────────────
  # 正常状态 LLM 自主调节；极端状态代码介入，防止 LLM 不自知
  threshold:
    # 连续低落检测
    consecutive_low_pleasure: 3       # 连续 N 轮 P 低于阈值 → 触发
    low_pleasure_threshold: -0.2      # P < 此值视为"低落"
                                      # 注意：风堇日常基线是 +0.65，
                                      # 降到 -0.2 对她来说已经是明显低落了
                                      # 所以阈值比通用方案 (-0.3) 更宽松

    # 严重低落（单轮即触发）
    very_low_pleasure_threshold: -0.4 # P < 此值任一轮 → 立即触发

    # 高唤醒
    high_arousal_threshold: 0.7       # A > 此值 → 追加"不要太兴奋"提醒

  # ── 注入格式（由代码硬编码，此处为文档参考）────────────────
  # 注入位置: user message 开头
  # 注入格式: [P+0.62 A+0.26 D+0.52 温暖] —— 数字 + 一句话标签
  # 持久化路径: data/mood_state.json（项目根相对路径），原子写入（.tmp → os.replace）

  # ── 标签映射（PAD → 风堇风格的情绪标签）─────────────────────
  # 标签不是给 LLM 做数学用的，是给它做文学用的——在"理解数字"
  # 和"感受情绪"之间架一座桥。
  labels:
    # P (愉悦度) 的标签区间
    pleasure_high: 0.4       # P > 此值 → "温暖"
    pleasure_low: -0.4       # P < 此值 → "低落"
                             # 中间 → "平静"

    # A (激活度) 叠加标签（可选，叠加到 P 标签上）
    arousal_high: 0.5        # A > 此值 → 叠加"活跃"
    arousal_low: 0.2         # A < 此值 → 叠加"慵懒"
                             # 中等 arousal → 不叠加

    # 标签映射示例:
    #   P+0.62 A+0.30 → "温暖" (P 高，A 中等)
    #   P+0.41 A+0.65 → "温暖活跃" (P > pleasure_high=0.4 严格大于，A 高)
    #   P-0.10 A+0.25 → "平静" (P 中，A 中)
    #   P-0.50 A+0.45 → "低落" (P 低，A 中)
