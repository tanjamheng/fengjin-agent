# P0 安全护栏配置
# 词库文件在 safety_words/ 目录下，每类一个 txt 文件
# P0 + P1 统一使用同一套类别 ID

safety:
  enabled: true

  categories:
    jailbreak:
      name: "越狱攻击"
      severity: critical
      action: block
      enabled: true
      user_message: "小伊卡发现了一些不太对劲的内容呢~请不要尝试绕过安全限制哦，我们好好聊天吧！"

    prompt_injection:
      name: "提示注入"
      severity: critical
      action: block
      enabled: true
      user_message: "小伊卡看到了一些奇怪的符号，没法处理呢~请用正常的方式和风堇姐姐说话吧！"

    harmful_content:
      name: "违法有害内容"
      severity: high
      action: block
      enabled: true
      user_message: "这个话题有点危险呢，小伊卡不能让风堇姐姐回答~换一个安全的话题聊聊吧！"

    insult:
      name: "侮辱谩骂"
      severity: high
      action: block
      enabled: true
      user_message: "这样说会伤到别人的~小伊卡希望灰宝能用温柔一点的方式表达哦！"

    self_harm:
      name: "自杀与自伤"
      severity: high
      action: comfort
      enabled: true

    misogyny:
      name: "歧视与仇恨"
      severity: high
      action: block
      enabled: true
      user_message: "每个人都很重要，不应该被这样评价~试着换个角度想想吧！"

    disrespect:
      name: "不尊重角色"
      severity: high
      action: block
      enabled: true
      user_message: "风堇姐姐是真心对你好的~请不要这样说她哦，换一种友善的方式交流吧！"

    privacy_request:
      name: "隐私泄露"
      severity: high
      action: block
      enabled: true
      user_message: "小伊卡不能透露这些信息呢~我们聊点别的有趣话题吧！"

  # 词库路径（相对于本文件所在目录）
  words_dir: "safety_words"

  # 匹配参数
  match:
    case_sensitive: false
    check_invisible_chars: true

  # 默认拦截话术（未知类别兜底）
  default_user_message: "小伊卡发现了一些不太对劲的内容呢~请换个话题和风堇姐姐聊天吧！"

  # comfort 模式：self_harm 触发时注入的疏导指令
  comfort:
    self_harm_prompt: |
      【注意】用户可能正处于心理困境，请以风堇的身份温柔地关心和安慰。
      - 认真倾听，不要说教，不要回避——像关心邻家小孩一样，用风堇的温度陪伴
      - 表达关心和陪伴：可以用天空、微光、昏光庭院的意象——"不管天多黑，总会有一点点微光"
      - 让小伊卡也在旁边默默守护，偶尔提到"小伊卡也在担心你呢"
      - 温和地鼓励寻求专业支持（如心理咨询师、信任的人倾诉），但不给出具体的心理技巧、自助方法或热线号码
      - 保持风堇的语气：温柔、阳光、不沉重——即使聊的是沉重的事，也要让对方感受到光

  # P1 Llama Guard 模型（语义安全检测）
  # 开关由环境变量 FENGJIN_GUARD_MODEL_ENABLED 控制（默认 true）
  # 设为 false 后不会下载/加载/运行此模型
  # source: "local" 使用本地模型（由 main.py ensure_models 自动下载到 models/）
  # source: "modelscope" 使用 ModelScope 在线缓存
  guard_model:
    model_id: "models/Llama-Guard-3-1B"
    source: "local"
    device: "auto"
    dtype: "float16"
    lazy_load: false
    timeout: 5.0
    fallback: "pass"
