# 角色漂移检测 + 修复闭环配置
# =================================
# 锚点文本不在此文件中——锚点唯一来源是 config/system_prompt.md §二，
# 代码启动时自动解析。

persona:
  # ── 检测参数 ────────────────────────────────────────────
  detection:
    ema_alpha: 0.3               # EWMA 平滑系数（0~1）
                                  # 0.1 = 变化极慢，10 轮后才反映趋势
                                  # 0.3 = 推荐值，3~5 轮反映趋势
                                  # 0.5 = 反应快但波动大

    drift_threshold: 0.48         # 低于此值触发修复（0~1）
                                  # 越高越敏感——0.75 = 轻微偏离就触发
                                  # 越低越宽容；0.48 按本项目实际回复分布校准

    consecutive_trigger: 3        # 连续 N 轮低于阈值才注入（防单轮抖动）

    min_reply_length: 15          # 回复少于此字数跳过检测（太短无意义）

  # ── 修复参数 ────────────────────────────────────────────
  repair:
    cooldown_rounds: 5            # 恢复后冷却 N 轮再重新检测（防反复触发）

  # ── 注入格式（由代码硬编码，此处为文档参考）─────────────
  # 注入位置: user message 开头（永远不变）
  # 注入标签: "[角色校准]"
  # 注入行为: 不入历史、用户不可见、用户无感、AI 理解但不暴露
