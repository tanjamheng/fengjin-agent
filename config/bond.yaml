# 风堇羁绊状态机配置
# =====================
# 追踪风堇与灰宝的羁绊关系（4 维），跨会话保留。
# 架构对齐 MoodEngine，更新语义不同（change clamp + 接近度衰减 替代 EMA）。
# 调参原则：一次只改一个参数，否则不知道哪个在起作用。

bond:
  # ── 初始值（首次对话时使用）──────────────────────────────────
  # 这四个值就是"风堇对灰宝的初始羁绊状态"——不是任意数字，
  # 而是从风堇天生温暖但对新朋友保留的性格推导出来的。
  defaults:
    warmth: 0.62              # 温暖度——对朋友天生温暖，不是中性的"0"
                               # 范围: [0, 1]。越高关系越亲近。
                               # 0.70~0.90 = 很温暖亲近，0.50~0.70 = 日常温暖（基线），
                               # 0.30~0.50 = 温和但保持距离，0.10~0.30 = 冷淡疏远
    trust: 0.25                # 信任度——刚开始认识，信任需要时间积累
                               # 范围: [0, 1]。变化最慢的维度。
                               # 0.60~0.85 = 很信任、愿意分享心里话，
                               # 0.30~0.60 = 有信任但保留，0.15~0.30 = 刚认识，
                               # 0.00~0.15 = 几乎不信任
    formality: 0.45            # 正式度——适度客气，不会一开始就太随意
                               # 范围: [0, 1]。越高越正式。
                               # 0.55~0.75 = 礼貌客气，0.35~0.55 = 自然随意（日常），
                               # 0.15~0.35 = 很随意亲近，0.00~0.15 = 极度随意
    humor: 0.15                # 幽默度——不熟不轻易开玩笑
                               # 范围: [0, 1]。越高玩笑越多。
                               # 0.40~0.70 = 经常开玩笑、氛围轻松，
                               # 0.20~0.40 = 偶尔轻松，0.05~0.20 = 几乎不开玩笑（初始），
                               # 0.00~0.05 = 完全不幽默

  # ── 更新控制 ─────────────────────────────────────────────────
  update:
    change_clamp: 0.05         # 单轮变化封顶（绝对值），阻止异常大值
                               # 调大 → 关系变化更快，调小 → 更保守

    # 接近度衰减——正向变化越靠近满分越慢，降温不设障碍
    proximity:
      floor: 0.25              # 最低速度因子——保证满分永远可达（非渐近线）
      power: 4                 # 四次幂——前期几乎不减速（old<0.7 时 factor>0.82），
                               # 0.85 后加速收紧

    # 单轮跳变告警
    change_warn_threshold: 0.08  # |raw_change| > 此值 → warning 日志

  # ── 漂移保护（会话级追踪 + 告警 + 硬刹车）──────────────────
  drift_guard:
    session_cumulative_warn: 0.25   # 单会话同维度累计变化超过此值 → warning
    session_cumulative_brake: 0.35  # 单会话同维度累计超过此值 → 后续同向 delta 强制降为 ±0.01
    consecutive_same_warn: 8        # 同维度连续同向轮数超过此值 → warning
    consecutive_same_brake: 12      # 同维度连续同向超过此值 → 后续同向 delta 强制降为 ±0.01

  # ── 时间衰减（羁绊随时间向基线回归）────────────────────────
  # 公式: B(t) = baseline + (B₀ − baseline) × e^(−λ × hours)
  # 衰减在每次 load/update 时自动计算，不需后台线程。
  decay:
    # Warmth 半衰期——两周不聊才衰减一半
    warmth_half_life_h: 336       # 336h = 14 天
    warmth_baseline: 0.40         # 衰减至"温和但保持距离"的下限

    # Trust 半衰期——真正信任几乎锁定，半年才衰减一半
    trust_half_life_h: 4320       # 4320h = 180 天
    trust_baseline: 0.25          # 衰减至初始信任水平

    # Formality 半衰期——两周不聊回升一半（趋向正式）
    formality_half_life_h: 336    # 336h = 14 天
    formality_baseline: 0.65      # 回升至"礼貌客气"——注意：基线 > 初始值，
                                  # 公式自动处理"回升"（衰减方向由 diff 符号决定）

    # Humor 半衰期——28 天才衰减一半，幽默模式不易退化
    humor_half_life_h: 672        # 672h = 28 天
    humor_baseline: 0.20          # 封底比初始值略高——一旦建立不会完全退化

    # 最小衰减间隔——短于此值不衰减（避免对话中多此一举）
    min_interval_seconds: 36      # 与 mood 一致

  # ── 标签映射（4 维综合值 → 阶段标签）──────────────────────
  labels:
    # 综合值公式: Warmth×0.35 + Trust×0.30 + (1-Formality)×0.20 + Humor×0.15
    # 权重和为 1.00
    stage_close: 0.55             # 综合值 ≥ 此值 → "亲近"
    stage_familiar: 0.30          # 综合值 ≥ 此值 → "熟悉"
                                  # 综合值 < 此值 → "初识"

  # ── 注入格式（由代码硬编码，此处为文档参考）────────────────
  # 注入位置: user message 头部（在情绪行之后）
  # 注入格式: [B W+0.65 T+0.42 F+0.35 H+0.22 亲近] —— 数字 + 标签
  # 持久化路径: data/bond_state.json（项目根相对路径），原子写入（.tmp → os.replace）
