name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for backend validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python backend syntax
        run: python -m compileall -q src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # ---- 前端构建 --------------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (electron-vite)
        working-directory: frontend
        run: npm run build

      - name: Patch electron-builder 7za wrapper
        working-directory: frontend
        shell: pwsh
        run: |
          $sevenDir = "node_modules\7zip-bin\win\x64"
          $sevenIndex = "node_modules\7zip-bin\index.js"
          $builderUtil = "node_modules\builder-util\out\util.js"
          if (-not (Test-Path "$sevenDir\7za.cmd")) {
            if (Test-Path "$sevenDir\7za.exe") {
              Rename-Item "$sevenDir\7za.exe" "7za_real.exe"
            }
            Set-Content "$sevenDir\7za.cmd" "@echo off`r`n""%~dp07za_real.exe"" %*`r`nexit /b %ERRORLEVEL%`r`n" -Encoding ASCII

            $txt = Get-Content $sevenIndex -Raw
            $txt = $txt -replace '7za\.exe', '7za.cmd'
            [System.IO.File]::WriteAllText($sevenIndex, $txt)

            $txt = Get-Content $builderUtil -Raw
            if ($txt -notmatch 'needsShell') {
              $old = 'maxBuffer: 1000 * 1024 * 1024,'
              $new = 'shell: file.endsWith(''.cmd'') || file.endsWith(''.bat''), maxBuffer: 1000 * 1024 * 1024,'
              $txt = $txt -replace [regex]::Escape($old), $new
              [System.IO.File]::WriteAllText($builderUtil, $txt)
            }

            $sevenScript = "node_modules\builder-util\out\7za.js"
            $txt = Get-Content $sevenScript -Raw
            $txt = $txt -replace 'const fs_extra_1 = require\("fs-extra"\);', '// patched'
            $txt = $txt -replace 'await \(0, fs_extra_1\.chmod\)\([^)]+\);', '// patched chmod'
            [System.IO.File]::WriteAllText($sevenScript, $txt)
          }

      - name: Package Electron exe (electron-builder portable)
        working-directory: frontend
        run: npx electron-builder --win portable

      # ---- 组装发布包 -------------------------------------------------
      - name: Assemble release folder
        shell: pwsh
        run: |
          $version = (Get-Content frontend\package.json | ConvertFrom-Json).version
          $releaseDir = "release\风堇AI-v$version"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          # Portable exe（electron-builder 输出到 frontend\dist）
          $exe = Get-ChildItem frontend\dist -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "Electron portable exe was not produced" }
          Copy-Item $exe.FullName "$releaseDir\风堇AI.exe"

          # Python 后端 + 配置
          Copy-Item src          "$releaseDir\src"         -Recurse
          Copy-Item config       "$releaseDir\config"      -Recurse
          Copy-Item "数据侧_风堇资料" "$releaseDir\数据侧_风堇资料" -Recurse
          Copy-Item requirements.txt "$releaseDir\"
          Copy-Item .env.example      "$releaseDir\"
          Copy-Item README.md         "$releaseDir\" -ErrorAction SilentlyContinue
          Copy-Item LICENSE           "$releaseDir\" -ErrorAction SilentlyContinue
          Copy-Item THIRD_PARTY_ASSETS.md "$releaseDir\" -ErrorAction SilentlyContinue
          Copy-Item THIRD_PARTY_NOTICES.md "$releaseDir\" -ErrorAction SilentlyContinue

          # 空目录（用户首次启动时填充）
          New-Item -ItemType Directory -Force -Path "$releaseDir\models"           | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\data\sessions"    | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\data\chroma"      | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\data\memory"      | Out-Null
          New-Item -ItemType Directory -Force -Path "$releaseDir\logs"             | Out-Null

          # 发布目录完整性检查 + 校验清单
          $required = @(
            "风堇AI.exe", "src", "config", "数据侧_风堇资料",
            "requirements.txt", ".env.example", "models", "data\sessions", "logs"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $releaseDir $_)) }
          if ($missing) { throw "Release folder is incomplete: $($missing -join ', ')" }
          Get-ChildItem $releaseDir -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path.Substring($releaseDir.Length + 1))" } |
            Set-Content (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding utf8

          # 打 zip
          $zipName = "风堇AI-v$version-portable.zip"
          Compress-Archive -Path "$releaseDir" -DestinationPath "release\$zipName" -Force
          Write-Output "zip=release\$zipName" >> $env:GITHUB_ENV
          Write-Output "version=$version" >> $env:GITHUB_ENV
          Write-Output "Release zip: release\$zipName"

      # ---- 发布到 GitHub Releases ------------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "风堇AI v${{ env.version }}"
          files: release/风堇AI-v*.zip
          generate_release_notes: true
          body: |
            ## 首次运行说明
            - 此发布包已包含 Electron 桌面客户端，不需要安装 Node.js。
            - 当前版本需要 Windows 已安装并加入 PATH 的 Python 3.10+；首次运行会创建虚拟环境、安装 Python 依赖并下载本地模型。
            - 首次启动需要联网，并预留充足磁盘空间；后续启动会复用已创建的环境与模型。
            - 请先在应用内填写 API 配置。发布包内的 `SHA256SUMS.txt` 可用于校验文件完整性。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
